# Blueprint de Render para la VISTA PREVIA GRATUITA de Knowledge Desk: un único
# web service que sirve la API y la interfaz compilada en el mismo origen.
#
# - Motor de consulta: el servicio REAL de ForUsGuide (KD_MODO=forusguide,
#   POST /api/v1/knowledge-question). Las respuestas y fuentes salen de su corpus.
# - Solo consulta: sin PINECONE_*, Knowledge Desk no tiene indexación y nunca
#   escribe, siembra ni borra en el índice compartido de ForUsGuide. Documentos lo
#   indica y no permite cargar artículos. Con KD_ACCESO_PUBLICO=true el servidor
#   se niega a arrancar si alguien añade PINECONE_API_KEY o PINECONE_INDEX_HOST.
# - Acceso público (KD_ACCESO_PUBLICO=true): sin inicio de sesión. Cada consulta
#   llama a ForUsGuide con la clave del servidor y consume su cuota.
# - Plan free, sin disco: el registro local vive en /tmp y es temporal
#   (KD_DATOS_TEMPORALES=true). La persistencia es un paso futuro no autorizado.
# - No contiene secretos. Las variables con "sync: false" se rellenan en el panel
#   de Render; nunca se escriben en este archivo.
# - autoDeploy: false. Nada se despliega sin una acción explícita.
services:
  - type: web
    name: knowledge-desk-preview
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: npm ci --prefix knowledge-desk-ui --include=dev && npm run build --prefix knowledge-desk-ui && npm ci --prefix knowledge-desk-server --omit=dev
    startCommand: node knowledge-desk-server/src/main.ts
    healthCheckPath: /api/salud
    envVars:
      # Runtime con TypeScript nativo (type stripping): Node 22.18 o superior.
      - key: NODE_VERSION
        value: 24.14.0
      - key: KD_HOST
        value: 0.0.0.0
      # Almacenamiento efímero de la vista previa, y el aviso correspondiente.
      - key: KD_DATA_DIR
        value: /tmp/knowledge-desk
      - key: KD_DATOS_TEMPORALES
        value: "true"
      # Consulta con el servicio real de ForUsGuide. La X-API-Key solo en el panel.
      - key: KD_MODO
        value: forusguide
      - key: FORUSGUIDE_API_URL
        value: https://forusguide.onrender.com
      - key: FORUSGUIDE_API_KEY
        sync: false
      # Límite de artículos JSON (sin efecto mientras no haya indexación).
      - key: KD_MAX_ARTICULO_MB
        value: "10"
      # Acceso directo sin inicio de sesión, por decisión del usuario para esta
      # vista previa: cualquiera con la URL consulta. No se combina con
      # KD_ACCESO_BASICO, KD_IDENTIDAD_HEADER, KD_PROXY_SECRETO, KD_OPERADORES ni,
      # en este modo, PINECONE_*: si alguna está definida, el servidor no arranca.
      - key: KD_ACCESO_PUBLICO
        value: "true"
      - key: KD_CONTACTO_URL
        sync: false
